name: Release to PyPI
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write   # PyPI trusted publishing, no token stored anywhere
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
