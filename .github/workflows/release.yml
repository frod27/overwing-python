name: Release to PyPI
# Every action is pinned to a commit, with its version in the comment beside it, so a tag moved
# upstream cannot change what runs here. Dependabot proposes new pins (.github/dependabot.yml).
# Nothing here pushes to the repository, so checkout does not leave its token on disk.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  # The distributions are built in a job that cannot publish, and handed over as an artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The only job that can publish. It never checks out the repository or runs the build: it takes
  # the finished distributions and hands them to PyPI.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing, no token stored anywhere
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
