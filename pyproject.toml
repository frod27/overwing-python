[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "overwing"
version = "0.2.0"
description = "Overwing SDK: guardrails for LLM output. Typed client for the Overwing API plus OpenAI Agents SDK guardrails and LangChain runnables/callbacks that check every message before it ships."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Overwing", email = "support@overwing.ai" }]
keywords = ["overwing", "guardrails", "llm", "ai-safety", "content-moderation", "pii", "toxicity", "openai-agents", "langchain", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
agents = ["openai-agents>=0.1"]
langchain = ["langchain-core>=0.3"]

[project.urls]
Homepage = "https://overwing.ai"
Documentation = "https://overwing.ai/docs"
Repository = "https://github.com/frod27/overwing-python"
Issues = "https://github.com/frod27/overwing-python/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "openai-agents>=0.1",
    "mypy>=1.11",
    "langchain-core>=1.6.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/overwing"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
